name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  mcp:
    name: MCP server (install + syntax check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - run: node --check server.mjs && node --check tools.mjs
      - name: Tool list loads
        run: node -e "import('./tools.mjs').then(m => { const n = Object.keys(m).length; if (!n) throw new Error('tools.mjs exports nothing'); console.log('exports:', Object.keys(m).join(', ')); })"
